<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Imobiliária Multi-Clientes</title>
    <!-- Tailwind CSS para Estilização Responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Cabeçalho / Menu -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold mb-2 md:mb-0">🏠 ImóveisHub</h1>
            <nav class="space-x-4">
                <button onclick="mudarAba('vitrine')" id="btn-vitrine" class="font-semibold hover:underline">Vitrine de Imóveis</button>
                <button onclick="mudarAba('painel')" id="btn-painel" class="font-semibold hover:underline bg-blue-700 px-3 py-1 rounded">Cadastrar Meu Imóvel</button>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container mx-auto px-4 py-8">

        <!-- ABA 1: VITRINE PÚBLICA -->
        <section id="aba-vitrine" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">Imóveis Disponíveis</h2>
                <span id="total-imoveis" class="text-sm text-gray-500">Carregando...</span>
            </div>
            
            <!-- Grid de Imóveis -->
            <div id="grid-imoveis" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Os imóveis serão inseridos dinamicamente aqui via JavaScript -->
            </div>
        </section>

        <!-- ABA 2: PAINEL DE CADASTRO DO CLIENTE -->
        <section id="aba-painel" class="hidden max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md space-y-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Painel do Anunciante</h2>
                <p class="text-sm text-gray-600">Cadastre seu imóvel para exibi-lo na vitrine pública instantaneamente.</p>
            </div>

            <form id="form-imovel" onsubmit="salvarImovel(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Título do Imóvel</label>
                    <input type="text" id="titulo" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" placeholder="Ex: Casa Ampla com 3 Quartos">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Preço (R$)</label>
                        <input type="number" id="preco" required class="w-full mt-1 p-2 border rounded-md" placeholder="Ex: 350000">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tipo de Imóvel</label>
                        <select id="tipo" class="w-full mt-1 p-2 border rounded-md">
                            <option value="Casa">Casa</option>
                            <option value="Apartamento">Apartamento</option>
                            <option value="Terreno">Terreno</option>
                            <option value="Comercial">Comercial</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Cidade / Região</label>
                        <input type="text" id="cidade" required class="w-full mt-1 p-2 border rounded-md" placeholder="Ex: Ji-Paraná - RO">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nome do Anunciante / Contato</label>
                        <input type="text" id="anunciante" required class="w-full mt-1 p-2 border rounded-md" placeholder="Ex: Carlos Silva (WhatsApp)">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">URL da Foto do Imóvel</label>
                    <input type="url" id="foto" required class="w-full mt-1 p-2 border rounded-md" placeholder="Cole o link de uma imagem da internet (ex: Unsplash)">
                    <span class="text-xs text-gray-400">Dica: Você pode usar imagens públicas de exemplo da web.</span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Descrição Completa</label>
                    <textarea id="descricao" rows="3" required class="w-full mt-1 p-2 border rounded-md" placeholder="Detalhes sobre o imóvel..."></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-md font-semibold hover:bg-blue-700 transition">
                    Publicar Imóvel na Vitrine
                </button>
            </form>

            <hr class="my-6">

            <!-- Meus Imóveis Cadastrados -->
            <div>
                <h3 class="text-lg font-bold text-gray-800 mb-3">Seus Anúncios Publicados</h3>
                <div id="lista-meus-imoveis" class="space-y-3">
                    <!-- Lista dinâmica de exclusão -->
                </div>
            </div>
        </section>

    </main>

    <!-- Script Completo Embutido -->
    <script>
        // Banco de dados simulado no navegador (localStorage)
        function carregarImoveis() {
            const dados = localStorage.getItem('imoveis_hub');
            if (!dados) {
                // Imóveis padrão caso esteja vazio pela primeira vez
                const padrao = [
                    {
                        id: 1,
                        titulo: "Casa Residencial Moderna",
                        preco: 420000,
                        tipo: "Casa",
                        cidade: "Ji-Paraná - RO",
                        anunciante: "Imobiliária Central",
                        foto: "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=600&q=80",
                        descricao: "Linda casa com acabamento em porcelanato, 3 quartos sendo 1 suíte."
                    },
                    {
                        id: 2,
                        titulo: "Apartamento no Centro",
                        preco: 250000,
                        tipo: "Apartamento",
                        cidade: "Ji-Paraná - RO",
                        anunciante: "João Proprietário",
                        foto: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=600&q=80",
                        descricao: "Apartamento aconchegante perto de comércios, escolas e bancos."
                    }
                ];
                localStorage.setItem('imoveis_hub', JSON.stringify(padrao));
                return padrao;
            }
            return JSON.parse(dados);
        }

        function salvarNoStorage(imoveis) {
            localStorage.setItem('imoveis_hub', JSON.stringify(imoveis));
        }

        // Alternar entre abas
        function mudarAba(aba) {
            const vitrine = document.getElementById('aba-vitrine');
            const painel = document.getElementById('aba-painel');

            if (aba === 'vitrine') {
                vitrine.classList.remove('hidden');
                painel.classList.add('hidden');
                renderizarVitrine();
            } else {
                vitrine.classList.add('hidden');
                painel.classList.remove('hidden');
                renderizarMeusImoveis();
            }
        }

        // Renderizar a Vitrine Pública
        function renderizarVitrine() {
            const imoveis = carregarImoveis();
            const grid = document.getElementById('grid-imoveis');
            const contador = document.getElementById('total-imoveis');
            
            grid.innerHTML = '';
            contador.innerText = `${imoveis.length} imóvel(is) encontrado(s)`;

            if (imoveis.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">Nenhum imóvel cadastrado no momento.</p>`;
                return;
            }

            imoveis.forEach(imovel => {
                const precoFormatado = Number(imovel.preco).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const card = document.createElement('div');
                card.className = "bg-white rounded-lg shadow-md overflow-hidden flex flex-col justify-between hover:shadow-lg transition";
                card.innerHTML = `
                    <div>
                        <img src="${imovel.foto}" alt="${imovel.titulo}" class="w-full h-48 object-cover">
                        <div class="p-4 space-y-2">
                            <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-1 rounded">${imovel.tipo}</span>
                            <h3 class="text-xl font-bold text-gray-800">${imovel.titulo}</h3>
                            <p class="text-lg font-semibold text-green-600">${precoFormatado}</p>
                            <p class="text-sm text-gray-500">📍 ${imovel.cidade}</p>
                            <p class="text-sm text-gray-600 line-clamp-2">${imovel.descricao}</p>
                        </div>
                    </div>
                    <div class="p-4 bg-gray-50 border-t flex justify-between items-center text-sm">
                        <span class="text-gray-600">Anunciante: <strong>${imovel.anunciante}</strong></span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Salvar novo imóvel via formulário do cliente
        function salvarImovel(event) {
            event.preventDefault();

            const novoImovel = {
                id: Date.now(),
                titulo: document.getElementById('titulo').value,
                preco: document.getElementById('preco').value,
                tipo: document.getElementById('tipo').value,
                cidade: document.getElementById('cidade').value,
                anunciante: document.getElementById('anunciante').value,
                foto: document.getElementById('foto').value,
                descricao: document.getElementById('descricao').value
            };

            const imoveis = carregarImoveis();
            imoveis.unshift(novoImovel); // Adiciona no início da lista
            salvarNoStorage(imoveis);

            alert('Imóvel cadastrado com sucesso!');
            document.getElementById('form-imovel').reset();
            renderizarMeusImoveis();
            mudarAba('vitrine');
        }

        // Renderizar lista de gerenciamento no painel do cliente
        function renderizarMeusImoveis() {
            const imoveis = carregarImoveis();
            const lista = document.getElementById('lista-meus-imoveis');
            lista.innerHTML = '';

            if (imoveis.length === 0) {
                lista.innerHTML = `<p class="text-sm text-gray-500">Você ainda não tem imóveis cadastrados.</p>`;
                return;
            }

            imoveis.forEach(imovel => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-gray-50 p-3 rounded border";
                item.innerHTML = `
                    <div>
                        <h4 class="font-semibold text-gray-800">${imovel.titulo}</h4>
                        <p class="text-xs text-gray-500">${imovel.cidade} - R$ ${Number(imovel.preco).toLocaleString('pt-BR')}</p>
                    </div>
                    <button onclick="deletarImovel(${imovel.id})" class="bg-red-500 text-white text-xs px-3 py-1 rounded hover:bg-red-600 transition">Excluir</button>
                `;
                lista.appendChild(item);
            });
        }

        // Deletar imóvel
        function deletarImovel(id) {
            if (confirm('Deseja realmente remover este anúncio?')) {
                let imoveis = carregarImoveis();
                imoveis = imoveis.filter(i => i.id !== id);
                salvarNoStorage(imoveis);
                renderizarMeusImoveis();
            }
        }

        // Inicializar a aplicação abrindo na vitrine
        renderizarVitrine();
    </script>
</body>
</html>
